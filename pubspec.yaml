name: salaryflow
description: "SalaryFlow – Personal Finance Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Dependency Injection
  get_it: ^8.0.3

  # Database - Drift (SQLite ORM)
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.4
  path_provider: ^2.1.5
  path: ^1.9.1

  # Charts
  fl_chart: ^0.70.2

  # PDF & Excel Export
  pdf: ^3.11.2
  excel: ^4.0.6
  printing: ^5.14.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

  # Utilities
  intl: ^0.20.2
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  uuid: ^4.5.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.25.2
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
